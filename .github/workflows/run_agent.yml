name: Frontle Social Agent

on:
  schedule:
    - cron: '0 15 * * *'   # 9am CST
    - cron: '0 19 * * *'   # 1pm CST
    - cron: '0 0 * * *'    # 6pm CST
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config from secrets
        run: |
          cat > config.py << 'EOF'
          GROQ_API_KEY = "${{ secrets.GROQ_API_KEY }}"
          STABILITY_API_KEY = "${{ secrets.STABILITY_API_KEY }}"

          TWITTER_API_KEY = "${{ secrets.TWITTER_API_KEY }}"
          TWITTER_API_SECRET = "${{ secrets.TWITTER_API_SECRET }}"
          TWITTER_ACCESS_TOKEN = "${{ secrets.TWITTER_ACCESS_TOKEN }}"
          TWITTER_ACCESS_SECRET = "${{ secrets.TWITTER_ACCESS_SECRET }}"

          REDDIT_CLIENT_ID = "${{ secrets.REDDIT_CLIENT_ID }}"
          REDDIT_CLIENT_SECRET = "${{ secrets.REDDIT_CLIENT_SECRET }}"
          REDDIT_USERNAME = "${{ secrets.REDDIT_USERNAME }}"
          REDDIT_PASSWORD = "${{ secrets.REDDIT_PASSWORD }}"

          FACEBOOK_PAGE_ID = "${{ secrets.FACEBOOK_PAGE_ID }}"
          FACEBOOK_PAGE_ACCESS_TOKEN = "${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}"

          INSTAGRAM_ACCOUNT_ID = "${{ secrets.INSTAGRAM_ACCOUNT_ID }}"

          CLOUDINARY_CLOUD_NAME = "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          CLOUDINARY_API_KEY = "${{ secrets.CLOUDINARY_API_KEY }}"
          CLOUDINARY_API_SECRET = "${{ secrets.CLOUDINARY_API_SECRET }}"

          YOUTUBE_CLIENT_ID = "${{ secrets.YOUTUBE_CLIENT_ID }}"
          YOUTUBE_CLIENT_SECRET = "${{ secrets.YOUTUBE_CLIENT_SECRET }}"
          YOUTUBE_REFRESH_TOKEN = "${{ secrets.YOUTUBE_REFRESH_TOKEN }}"

          TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"

          APP_NAME = "Frontle"
          APP_URL = "https://frontle.com"
          SUBPRIME_URL = "https://prime.frontle.com"
          SWITCH_URL = "https://prime.frontle.com/switch"

          PRODUCTS = {
              "dealership": {
                  "name": "Frontle",
                  "url": "https://frontle.com",
                  "hook": "save money at the dealership"
              },
              "subprime": {
                  "name": "Frontle Prime",
                  "url": "https://prime.frontle.com",
                  "hook": "get the best deal even with bad credit"
              },
              "switch": {
                  "name": "Frontle Switch",
                  "url": "https://prime.frontle.com/switch",
                  "hook": "lower your car payment by switching vehicles"
              }
          }
          EOF

      - name: Run agent
        run: python agent.py
